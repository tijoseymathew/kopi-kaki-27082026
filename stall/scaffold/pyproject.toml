# Your stall's manifest. You do not have to touch it.
#
# The rule is no agent frameworks and no vendor SDKs — not "no libraries".
# If a package genuinely helps (a better HTTP client, a parser, a tokeniser),
# add it to `dependencies` below and it will be installed for your graded run
# too. Everything the workshop actually teaches, you still build yourself.
#
#     dependencies = ["httpx>=0.27"]
#
# `stall chat` runs your agent through `uv run`, so what works locally is what
# the stall resolves. A manifest the stall cannot resolve is a structural
# error: you get the full uv output, and it costs you no run and no cooldown.

[project]
name = "my-stall"
version = "0"
requires-python = ">=3.11"
dependencies = []
